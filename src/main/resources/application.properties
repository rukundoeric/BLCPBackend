server.port=9009

spring.application.name=blcp-backend
spring.datasource.url=jdbc:postgresql://localhost:5433/blcp_db
spring.datasource.username=blcp_user
spring.datasource.password=blcp_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging.level.root=INFO
logging.level.rw.blcp=DEBUG
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){faint} %clr([%X{traceId:-NO_TRACE}]){cyan} %clr(%-5level) %clr(%logger{36}){magenta} - %msg%n


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=300000
app.jwt.refresh-expiration-hours=8

app.cors.allowed-origins=http://localhost:4022


#Browsers silently reject Secure cookies over plain HTTP, I'm tuning it off for development
app.cookie.secure=false
